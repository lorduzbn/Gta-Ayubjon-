<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>GTA Ayubjon</title>
<style>
  :root{
    --bg:#050505;
    --panel:rgba(10,10,10,.62);
    --line:rgba(255,255,255,.12);
    --text:#fff;
    --muted:#cfcfcf;
    --accent:#f5c542;
    --good:#4dff8a;
    --danger:#ff5252;
    --blue:#6fb6ff;
  }

  *{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
    font-family:Arial, Helvetica, sans-serif;
  }

  html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:var(--text);
    touch-action:none;
  }

  #app{
    position:fixed;
    inset:0;
    background:#000;
  }

  .screen{
    position:absolute;
    inset:0;
    opacity:0;
    pointer-events:none;
    transition:opacity .45s ease;
  }

  .screen.show{
    opacity:1;
    pointer-events:auto;
  }

  /* START SCREEN */
  #startScreen{
    background:
      radial-gradient(circle at center, rgba(255,255,255,.08), transparent 38%),
      linear-gradient(to bottom, #111, #000 70%);
    overflow:hidden;
  }

  #startSlide{
    position:absolute;
    inset:-6%;
    width:112%;
    height:112%;
    object-fit:cover;
    filter:brightness(.92) contrast(1.08) saturate(1.08);
    transform:scale(1.04);
    transition:opacity 1s ease;
    animation:introPan 8s ease-in-out infinite;
    user-select:none;
    -webkit-user-drag:none;
  }

  @keyframes introPan{
    0%{transform:scale(1.04) translate3d(0,0,0)}
    50%{transform:scale(1.14) translate3d(-1%,-.8%,0)}
    100%{transform:scale(1.04) translate3d(0,0,0)}
  }

  .startOverlay{
    position:absolute;
    inset:0;
    background:
      linear-gradient(to top, rgba(0,0,0,.22), rgba(0,0,0,.06) 52%, rgba(0,0,0,.20)),
      radial-gradient(circle at center, rgba(255,255,255,.04), transparent 34%);
    pointer-events:none;
  }

  .startLogoWrap{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-52%);
    width:min(74vw, 250px);
    aspect-ratio:1/1;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:rgba(0,0,0,.24);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 18px 50px rgba(0,0,0,.42), inset 0 0 30px rgba(255,255,255,.05);
    backdrop-filter:blur(8px);
  }

  #bigLogo{
    width:78%;
    height:78%;
    object-fit:contain;
    filter:drop-shadow(0 12px 20px rgba(0,0,0,.45));
    user-select:none;
    -webkit-user-drag:none;
  }

  #startBtn{
    position:absolute;
    left:50%;
    bottom:58px;
    transform:translateX(-50%);
    width:88px;
    height:88px;
    border:none;
    border-radius:50%;
    background:radial-gradient(circle at 30% 30%, #ffffff, #e7e7e7 72%, #bfbfbf 100%);
    color:#111;
    font-size:17px;
    font-weight:900;
    letter-spacing:1px;
    box-shadow:0 14px 35px rgba(0,0,0,.35);
  }

  .startRing{
    position:absolute;
    left:50%;
    bottom:50px;
    transform:translateX(-50%);
    width:108px;
    height:108px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.14);
    border-top:2px solid var(--accent);
    animation:spin 1s linear infinite;
    opacity:.95;
    pointer-events:none;
  }

  @keyframes spin{
    from{transform:translateX(-50%) rotate(0deg)}
    to{transform:translateX(-50%) rotate(360deg)}
  }

  /* LOADING / SLIDESHOW */
  #loadingScreen{
    background:#000;
    overflow:hidden;
  }

  .slide{
    position:absolute;
    inset:-6%;
    width:112%;
    height:112%;
    object-fit:cover;
    opacity:0;
    transform:scale(1.05);
    transition:opacity 1.15s ease;
    animation:slideDrift 10s ease-in-out infinite;
    filter:brightness(.94) contrast(1.06) saturate(1.05);
    user-select:none;
    -webkit-user-drag:none;
  }

  @keyframes slideDrift{
    0%{transform:scale(1.05) translate3d(0,0,0)}
    50%{transform:scale(1.16) translate3d(-1.2%,-.8%,0)}
    100%{transform:scale(1.05) translate3d(0,0,0)}
  }

  .slide.active{ opacity:1; }

  .overlay{
    position:absolute;
    inset:0;
    background:
      linear-gradient(to top, rgba(0,0,0,.16), rgba(0,0,0,.04) 52%, rgba(0,0,0,.18)),
      radial-gradient(circle at center, rgba(255,255,255,.04), transparent 38%);
    pointer-events:none;
  }

  .cornerLogo{
    position:absolute;
    top:12px;
    left:12px;
    width:58px;
    height:58px;
    z-index:4;
    object-fit:contain;
    filter:drop-shadow(0 6px 18px rgba(0,0,0,.45));
    user-select:none;
    -webkit-user-drag:none;
  }

  .ring{
    position:absolute;
    left:50%;
    bottom:26px;
    transform:translateX(-50%);
    width:60px;
    height:60px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.14);
    border-top:2px solid var(--accent);
    animation:spin 1s linear infinite;
    opacity:.92;
  }

  /* GAME */
  #gameScreen{
    background:#111;
  }

  canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    background:#111;
  }

  .hud{
    position:absolute;
    inset:0;
    z-index:12;
    pointer-events:none;
  }

  .miniLogo{
    position:absolute;
    top:10px;
    left:10px;
    width:46px;
    height:46px;
    object-fit:contain;
    filter:drop-shadow(0 6px 12px rgba(0,0,0,.35));
  }

  .stats{
    position:absolute;
    top:10px;
    right:10px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .chip{
    min-width:112px;
    padding:8px 10px;
    border-radius:14px;
    background:var(--panel);
    border:1px solid var(--line);
    backdrop-filter:blur(10px);
    font-size:12px;
    box-shadow:0 10px 24px rgba(0,0,0,.22);
  }
  .chip b{ display:block; font-size:14px; margin-top:2px; }
  .health{ color:#ffcb4d; }
  .money{ color:#77ff8d; }
  .wanted{ color:#99c6ff; }
  .car{ color:#fff; }

  .missionBox{
    position:absolute;
    left:50%;
    top:10px;
    transform:translateX(-50%);
    padding:9px 14px;
    border-radius:999px;
    background:var(--panel);
    border:1px solid var(--line);
    font-size:12px;
    backdrop-filter:blur(10px);
    box-shadow:0 10px 24px rgba(0,0,0,.22);
    white-space:nowrap;
  }

  .toast{
    position:absolute;
    left:50%;
    top:16%;
    transform:translateX(-50%);
    background:rgba(0,0,0,.36);
    border:1px solid rgba(255,255,255,.12);
    padding:10px 14px;
    border-radius:999px;
    font-size:13px;
    opacity:0;
    transition:opacity .25s ease;
    text-align:center;
    max-width:82vw;
  }
  .toast.show{ opacity:1; }

  .controls{
    position:absolute;
    inset:0;
    z-index:15;
    pointer-events:none;
  }

  .joyArea{
    position:absolute;
    left:12px;
    bottom:14px;
    width:152px;
    height:152px;
    pointer-events:auto;
    touch-action:none;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .joyBase{
    width:132px;
    height:132px;
    border-radius:50%;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(8px);
    box-shadow:inset 0 0 20px rgba(0,0,0,.28);
    position:relative;
  }

  .joyKnob{
    width:58px;
    height:58px;
    border-radius:50%;
    background:radial-gradient(circle at 30% 30%, #fff, #d4d4d4 70%, #9f9f9f 100%);
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    box-shadow:0 10px 18px rgba(0,0,0,.28);
  }

  .buttons{
    position:absolute;
    right:10px;
    bottom:16px;
    pointer-events:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
    align-items:flex-end;
  }

  .actionBtn{
    width:78px;
    height:78px;
    border:none;
    border-radius:50%;
    color:#fff;
    font-size:14px;
    font-weight:900;
    letter-spacing:.5px;
    box-shadow:0 12px 26px rgba(0,0,0,.34);
  }

  .attackBtn{
    background:radial-gradient(circle at 30% 30%, #ff9c9c, #ff4d4d 72%, #cf1f1f 100%);
  }

  .carBtn{
    background:radial-gradient(circle at 30% 30%, #9cf6ff, #5fa7ff 72%, #3164b8 100%);
  }

  .mapBtn{
    background:radial-gradient(circle at 30% 30%, #fff1a8, #f5c542 72%, #b98b12 100%);
    color:#111;
  }

  .fadeBlack{
    position:absolute;
    inset:0;
    background:#000;
    opacity:0;
    z-index:30;
    pointer-events:none;
    transition:opacity .35s ease;
  }
  .fadeBlack.show{ opacity:1; }

  .minimap{
    position:absolute;
    left:10px;
    top:64px;
    width:112px;
    height:112px;
    border-radius:18px;
    background:rgba(0,0,0,.30);
    border:1px solid rgba(255,255,255,.12);
    overflow:hidden;
    backdrop-filter:blur(8px);
    box-shadow:0 10px 24px rgba(0,0,0,.22);
  }

  .minimap canvas{
    width:100%;
    height:100%;
    display:block;
  }

  .missionGlow{
    position:absolute;
    width:18px;
    height:18px;
    border-radius:50%;
    background:rgba(245,197,66,.9);
    box-shadow:0 0 16px rgba(245,197,66,.85);
    transform:translate(-50%,-50%);
    pointer-events:none;
  }

  @media (max-width:380px){
    #startBtn{ width:80px; height:80px; bottom:50px; }
    .startRing{ width:100px; height:100px; bottom:42px; }
    .cornerLogo{ width:52px; height:52px; }
    .miniLogo{ width:42px; height:42px; }
    .joyArea{ left:8px; bottom:10px; transform:scale(.92); transform-origin:left bottom; }
    .buttons{ right:8px; bottom:10px; transform:scale(.92); transform-origin:right bottom; }
    .minimap{ top:56px; left:8px; width:98px; height:98px; }
    .chip{ min-width:104px; }
  }
</style>
</head>
<body>
<div id="app">

  <div id="startScreen" class="screen show">
    <img id="startSlide" src="1781611691182.png" alt="intro slide">
    <div class="startOverlay"></div>
    <div class="startLogoWrap">
      <img id="bigLogo" src="image.jpg" alt="logo">
    </div>
    <div class="startRing"></div>
    <button id="startBtn">START</button>
  </div>

  <div id="loadingScreen" class="screen">
    <img class="slide active" id="slide1" src="1781611691182.png" alt="slide1">
    <img class="slide" id="slide2" src="1781611905098.png" alt="slide2">
    <img class="slide" id="slide3" src="1781612002906.png" alt="slide3">
    <div class="overlay"></div>
    <img class="cornerLogo" src="image.jpg" alt="logo">
    <div class="ring"></div>
  </div>

  <div id="gameScreen" class="screen">
    <canvas id="game"></canvas>

    <div class="hud">
      <img class="miniLogo" src="image.jpg" alt="logo">

      <div class="missionBox" id="missionText">Reach the mission marker for bonus money.</div>

      <div class="stats">
        <div class="chip health">HEALTH <b id="healthTxt">100</b></div>
        <div class="chip money">MONEY <b id="moneyTxt">$500</b></div>
        <div class="chip wanted">WANTED <b id="wantedTxt">0</b></div>
        <div class="chip car">CAR <b id="carTxt">ON FOOT</b></div>
      </div>

      <div class="minimap"><canvas id="miniMap"></canvas></div>
      <div class="toast" id="toast"></div>
    </div>

    <div class="controls">
      <div class="joyArea" id="joyArea">
        <div class="joyBase" id="joyBase"><div class="joyKnob" id="joyKnob"></div></div>
      </div>

      <div class="buttons">
        <button class="actionBtn attackBtn" id="attackBtn">ATK</button>
        <button class="actionBtn carBtn" id="carBtn">CAR</button>
        <button class="actionBtn mapBtn" id="missionBtn">JOB</button>
      </div>
    </div>

    <div class="fadeBlack" id="fadeBlack"></div>
    <div class="missionGlow" id="missionGlow"></div>
  </div>

  <audio id="music" loop preload="auto">
    <source src="IndianM.mp3" type="audio/mpeg">
  </audio>
</div>

<script>
(() => {
  const startScreen = document.getElementById('startScreen');
  const loadingScreen = document.getElementById('loadingScreen');
  const gameScreen = document.getElementById('gameScreen');
  const startBtn = document.getElementById('startBtn');
  const music = document.getElementById('music');
  const startSlide = document.getElementById('startSlide');
  const slideEls = [document.getElementById('slide1'), document.getElementById('slide2'), document.getElementById('slide3')];

  const game = document.getElementById('game');
  const ctx = game.getContext('2d');
  const miniMap = document.getElementById('miniMap');
  const mctx = miniMap.getContext('2d');

  const healthTxt = document.getElementById('healthTxt');
  const moneyTxt = document.getElementById('moneyTxt');
  const wantedTxt = document.getElementById('wantedTxt');
  const carTxt = document.getElementById('carTxt');
  const missionText = document.getElementById('missionText');
  const toast = document.getElementById('toast');
  const fadeBlack = document.getElementById('fadeBlack');
  const missionGlow = document.getElementById('missionGlow');

  const joyArea = document.getElementById('joyArea');
  const joyBase = document.getElementById('joyBase');
  const joyKnob = document.getElementById('joyKnob');
  const attackBtn = document.getElementById('attackBtn');
  const carBtn = document.getElementById('carBtn');
  const missionBtn = document.getElementById('missionBtn');

  const introSlides = ['1781611691182.png','1781611905098.png','1781612002906.png'];
  let introIndex = 0;
  let introTimer = null;
  let loadingTimer = null;
  let started = false;
  let loadingActive = false;

  const gameState = {
    w: 2600,
    h: 2600,
    day: 0,
    screenShake: 0,
    messageTimer: 0,
    missionReward: 250,
    missionsDone: 0
  };

  const input = { x: 0, y: 0, active: false };
  const viewport = { w: innerWidth, h: innerHeight };
  let camX = 0, camY = 0, lastTime = 0;

  let player = null;
  let cars = [];
  let npcs = [];
  let cops = [];
  let pickups = [];
  let mission = null;
  let inCar = false;
  let currentCar = null;
  let wanted = 0;
  let health = 100;
  let money = 500;
  let gameOver = false;

  function showScreen(screen){
    [startScreen, loadingScreen, gameScreen].forEach(s => s.classList.remove('show'));
    screen.classList.add('show');
  }

  function toastMsg(text, time = 1300){
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(toastMsg._t);
    toastMsg._t = setTimeout(() => toast.classList.remove('show'), time);
  }

  function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

  function resize(){
    viewport.w = innerWidth;
    viewport.h = innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    game.width = Math.floor(viewport.w * dpr);
    game.height = Math.floor(viewport.h * dpr);
    game.style.width = viewport.w + 'px';
    game.style.height = viewport.h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    miniMap.width = 112 * dpr;
    miniMap.height = 112 * dpr;
    miniMap.style.width = '112px';
    miniMap.style.height = '112px';
    mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize);

  function setKnob(dx, dy){
    joyKnob.style.transform = `translate(-50%,-50%) translate(${dx}px, ${dy}px)`;
  }

  function resetJoy(){
    input.x = 0;
    input.y = 0;
    input.active = false;
    setKnob(0, 0);
  }

  function moveJoy(e){
    const r = joyBase.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    let dx = e.clientX - cx;
    let dy = e.clientY - cy;
    const max = r.width * 0.28;
    const len = Math.hypot(dx, dy) || 1;
    if (len > max){
      dx = dx / len * max;
      dy = dy / len * max;
    }
    input.x = dx / max;
    input.y = dy / max;
    setKnob(dx, dy);
  }

  joyArea.addEventListener('pointerdown', (e) => {
    input.active = true;
    joyArea.setPointerCapture(e.pointerId);
    moveJoy(e);
  });
  joyArea.addEventListener('pointermove', (e) => {
    if (!input.active) return;
    moveJoy(e);
  });
  joyArea.addEventListener('pointerup', resetJoy);
  joyArea.addEventListener('pointercancel', resetJoy);

  function cycleIntroSlides(){
    slideEls[introIndex].classList.remove('active');
    introIndex = (introIndex + 1) % slideEls.length;
    slideEls[introIndex].classList.add('active');
  }

  function beginLoading(){
    if (loadingActive) return;
    loadingActive = true;
    startBtn.disabled = true;

    // audio on tap
    music.volume = 0.9;
    music.currentTime = 0;
    music.play().catch(() => {});

    showScreen(loadingScreen);
    introTimer = setInterval(cycleIntroSlides, 2600);

    setTimeout(() => {
      clearInterval(introTimer);
      introTimer = null;
      startGame();
    }, 8200);
  }

  function drawRoundedRect(x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function makeNPC(x, y){
    return {
      x, y,
      vx: (Math.random() - 0.5) * 0.7,
      vy: (Math.random() - 0.5) * 0.7,
      r: 11 + Math.random() * 4,
      panic: 0
    };
  }

  function makePickup(type, x, y){
    return { type, x, y, alive: true, pulse: Math.random() * Math.PI * 2 };
  }

  function makeCar(x, y, color = '#8d6b5d'){
    return {
      x, y,
      w: 36,
      h: 20,
      color,
      speed: 0,
      angle: 0,
      occupied: false,
      vx: 0,
      vy: 0
    };
  }

  function spawnMission(){
    const x = 180 + Math.random() * (gameState.w - 360);
    const y = 180 + Math.random() * (gameState.h - 360);
    mission = { x, y, active: true, radius: 30 };
    missionGlow.style.left = (x / gameState.w * 100) + '%';
    missionGlow.style.top = (y / gameState.h * 100) + '%';
  }

  function startGame(){
    showScreen(gameScreen);
    resize();

    player = { x: gameState.w / 2, y: gameState.h / 2, r: 14, speed: 2.35, angle: 0, health: 100, vx: 0, vy: 0 };
    cars = [
      makeCar(560, 640, '#7c5f52'),
      makeCar(1320, 980, '#4b82c9'),
      makeCar(1870, 1510, '#8a4fd2')
    ];
    npcs = [];
    for (let i = 0; i < 18; i++) npcs.push(makeNPC(220 + Math.random() * 2100, 220 + Math.random() * 2100));
    cops = [];
    pickups = [];
    for (let i = 0; i < 10; i++) pickups.push(makePickup(Math.random() > 0.6 ? 'health' : 'money', 240 + Math.random() * 2100, 240 + Math.random() * 2100));

    wanted = 0;
    health = 100;
    money = 500;
    inCar = false;
    currentCar = null;
    gameState.day = 0;
    gameState.screenShake = 0;
    gameState.messageTimer = 0;
    gameState.missionsDone = 0;
    gameOver = false;
    spawnMission();
    toastMsg('Reach the mission marker for bonus money.', 2000);
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  function enterExitCar(){
    if (gameOver) return;
    if (inCar && currentCar){
      player.x = currentCar.x + Math.cos(currentCar.angle) * 28;
      player.y = currentCar.y + Math.sin(currentCar.angle) * 28;
      inCar = false;
      currentCar.occupied = false;
      currentCar = null;
      carTxt.textContent = 'ON FOOT';
      toastMsg('Exited car');
      return;
    }

    let nearest = null;
    let best = 9999;
    for (const c of cars){
      const d = Math.hypot(player.x - c.x, player.y - c.y);
      if (d < 42 && d < best){ nearest = c; best = d; }
    }
    if (nearest){
      inCar = true;
      currentCar = nearest;
      nearest.occupied = true;
      carTxt.textContent = 'DRIVING';
      toastMsg('Car entered');
    } else {
      toastMsg('No car nearby', 900);
    }
  }

  function attack(){
    if (gameOver) return;

    const sourceX = inCar && currentCar ? currentCar.x : player.x;
    const sourceY = inCar && currentCar ? currentCar.y : player.y;

    let hit = false;
    for (const n of npcs){
      if (!n) continue;
      const d = Math.hypot(sourceX - n.x, sourceY - n.y);
      if (d < 46){
        hit = true;
        n.panic = 1;
        wanted = Math.min(5, wanted + 1);
        if (cops.length === 0){
          for (let i = 0; i < 2 + wanted; i++) cops.push({ x: 80 + Math.random() * 1800, y: 80 + Math.random() * 1800, r: 14, speed: 1.25 + Math.random() * .2 });
        }
        money += 30;
        gameState.screenShake = 8;
        toastMsg('Wanted level increased! Police incoming!');
        break;
      }
    }
    if (!hit) toastMsg('Nothing nearby', 800);
  }

  function missionAction(){
    if (gameOver) return;
    if (mission && mission.active){
      const sx = inCar && currentCar ? currentCar.x : player.x;
      const sy = inCar && currentCar ? currentCar.y : player.y;
      if (Math.hypot(sx - mission.x, sy - mission.y) < 42){
        mission.active = false;
        gameState.missionsDone += 1;
        const reward = gameState.missionReward + gameState.missionsDone * 50;
        money += reward;
        health = Math.min(100, health + 15);
        toastMsg('Mission complete! +' + reward);
        setTimeout(spawnMission, 800);
      } else {
        toastMsg('Go to the yellow marker');
      }
    }
  }

  function updateCity(dt){
    gameState.day += dt * 0.03;
    if (gameState.day > Math.PI * 2) gameState.day -= Math.PI * 2;

    const moveSpeed = inCar && currentCar ? 4.15 : 2.45;
    const dx = input.x * moveSpeed * dt * 60;
    const dy = input.y * moveSpeed * dt * 60;

    if (inCar && currentCar){
      currentCar.angle = Math.atan2(input.y, input.x) || currentCar.angle;
      if (Math.abs(input.x) + Math.abs(input.y) > 0.03){
        currentCar.vx += Math.cos(currentCar.angle) * 0.12;
        currentCar.vy += Math.sin(currentCar.angle) * 0.12;
      }
      currentCar.vx *= 0.985;
      currentCar.vy *= 0.985;
      currentCar.x += (dx + currentCar.vx * 5) * 1.15;
      currentCar.y += (dy + currentCar.vy * 5) * 1.15;
      currentCar.x = clamp(currentCar.x, 24, gameState.w - 24);
      currentCar.y = clamp(currentCar.y, 24, gameState.h - 24);
      player.x = currentCar.x;
      player.y = currentCar.y;
      player.angle = currentCar.angle;
    } else {
      player.x += dx;
      player.y += dy;
      player.x = clamp(player.x, 20, gameState.w - 20);
      player.y = clamp(player.y, 20, gameState.h - 20);
      if (Math.abs(input.x) + Math.abs(input.y) > 0.05) player.angle = Math.atan2(input.y, input.x);
    }

    // NPCs
    for (const n of npcs){
      if (Math.random() < 0.02){
        n.vx = (Math.random() - 0.5) * 0.8;
        n.vy = (Math.random() - 0.5) * 0.8;
      }
      if (n.panic > 0){
        const ax = n.x - player.x;
        const ay = n.y - player.y;
        const l = Math.hypot(ax, ay) || 1;
        n.vx = (ax / l) * 1.35;
        n.vy = (ay / l) * 1.35;
        n.panic -= dt * 1.6;
      }
      n.x += n.vx * dt * 60;
      n.y += n.vy * dt * 60;
      if (n.x < 24 || n.x > gameState.w - 24) n.vx *= -1;
      if (n.y < 24 || n.y > gameState.h - 24) n.vy *= -1;
      n.x = clamp(n.x, 24, gameState.w - 24);
      n.y = clamp(n.y, 24, gameState.h - 24);
    }

    // Cars roam a bit
    for (const c of cars){
      if (c.occupied) continue;
      c.angle += Math.sin(gameState.day + c.x * 0.001) * 0.0006;
    }

    // Pickups
    for (const p of pickups){
      if (!p.alive) continue;
      p.pulse += dt * 3;
      const sx = inCar && currentCar ? currentCar.x : player.x;
      const sy = inCar && currentCar ? currentCar.y : player.y;
      if (Math.hypot(sx - p.x, sy - p.y) < 26){
        p.alive = false;
        if (p.type === 'health'){
          health = Math.min(100, health + 25);
          toastMsg('+Health');
        } else {
          money += 80;
          toastMsg('+Money');
        }
      }
    }

    // Mission marker
    if (mission && mission.active){
      const sx = inCar && currentCar ? currentCar.x : player.x;
      const sy = inCar && currentCar ? currentCar.y : player.y;
      if (Math.hypot(sx - mission.x, sy - mission.y) < 30){
        missionAction();
      }
    }

    // Police AI
    if (wanted > 0){
      if (cops.length === 0) cops.push({ x: 80, y: 80, r: 14, speed: 1.35 });
      for (const c of cops){
        const sx = inCar && currentCar ? currentCar.x : player.x;
        const sy = inCar && currentCar ? currentCar.y : player.y;
        const ax = sx - c.x;
        const ay = sy - c.y;
        const l = Math.hypot(ax, ay) || 1;
        c.x += (ax / l) * c.speed * dt * 60;
        c.y += (ay / l) * c.speed * dt * 60;
        const d = Math.hypot(sx - c.x, sy - c.y);
        if (d < 18){
          health -= 12 * dt * 60 * 0.25;
          gameState.screenShake = 4;
        }
      }
    }

    if (wanted > 0 && Math.random() < 0.0025) wanted = Math.min(5, wanted + 1);
    if (wanted > 0 && Math.random() < 0.004) {
      // wanted slowly decays only if you run safely
      const sx = inCar && currentCar ? currentCar.x : player.x;
      const sy = inCar && currentCar ? currentCar.y : player.y;
      if (Math.random() < 0.5 && sx > 100 && sy > 100 && sx < gameState.w - 100 && sy < gameState.h - 100) wanted = Math.max(0, wanted - 1);
    }

    if (health <= 0){
      health = 0;
      gameOver = true;
      fadeBlack.classList.add('show');
      setTimeout(() => {
        fadeBlack.classList.remove('show');
        toastMsg('Restarting...');
        wanted = 0;
        health = 100;
        money = 500;
        gameOver = false;
        startGame();
      }, 1100);
    }

    // Camera
    const targetX = (inCar && currentCar ? currentCar.x : player.x) - viewport.w / 2;
    const targetY = (inCar && currentCar ? currentCar.y : player.y) - viewport.h / 2;
    camX += (targetX - camX) * 0.08;
    camY += (targetY - camY) * 0.08;
    camX = clamp(camX, 0, gameState.w - viewport.w);
    camY = clamp(camY, 0, gameState.h - viewport.h);

    // UI
    healthTxt.textContent = Math.round(health);
    moneyTxt.textContent = '$' + money.toLocaleString();
    wantedTxt.textContent = '★'.repeat(wanted) + (wanted ? '' : '0');
    carTxt.textContent = inCar ? 'DRIVING' : 'ON FOOT';
    missionText.textContent = mission && mission.active ? 'Reach the yellow marker' : 'Mission complete';

    // shake
    if (gameState.screenShake > 0) gameState.screenShake = Math.max(0, gameState.screenShake - dt * 30);
  }

  function drawRoadBase(){
    ctx.fillStyle = '#101010';
    ctx.fillRect(0, 0, viewport.w, viewport.h);

    const grid = 220;
    const ox = -(camX % grid);
    const oy = -(camY % grid);

    for (let y = oy - grid; y < viewport.h + grid; y += grid){
      for (let x = ox - grid; x < viewport.w + grid; x += grid){
        const wx = x + camX;
        const wy = y + camY;
        const street = ((Math.floor(wx / grid) + Math.floor(wy / grid)) % 2 === 0);

        ctx.fillStyle = street ? '#141414' : '#0f0f0f';
        ctx.fillRect(x, y, grid - 2, grid - 2);

        if (street){
          ctx.fillStyle = 'rgba(255,255,255,.035)';
          ctx.fillRect(x + 8, y + 8, grid - 18, grid - 18);
        }

        ctx.fillStyle = 'rgba(255,255,255,.05)';
        ctx.fillRect(x + grid / 2 - 2, y + 8, 4, grid - 16);
        ctx.fillRect(x + 8, y + grid / 2 - 2, grid - 16, 4);
      }
    }
  }

  function drawBuildings(){
    for (let i = 0; i < 38; i++){
      const bx = ((i * 155) % gameState.w) - camX;
      const by = ((Math.floor(i / 8) * 265) % gameState.h) - camY;
      const w = 52 + (i % 3) * 18;
      const h = 52 + ((i + 1) % 4) * 18;
      ctx.fillStyle = i % 2 ? '#1c1c1c' : '#202020';
      ctx.fillRect(bx, by, w, h);
      ctx.fillStyle = 'rgba(245,197,66,.11)';
      ctx.fillRect(bx + 8, by + 8, w - 16, h - 16);
    }
  }

  function drawPerson(x, y, r, fill, label = ''){
    ctx.beginPath();
    ctx.arc(x - camX, y - camY, r, 0, Math.PI * 2);
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#fff';
    ctx.stroke();
    if (label){
      ctx.font = '11px Arial';
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.fillText(label, x - camX, y - camY - r - 8);
    }
  }

  function drawCar(c){
    const x = c.x - camX;
    const y = c.y - camY;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(c.angle);
    ctx.fillStyle = c.color;
    drawRoundedRect(-18, -10, 36, 20, 5);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.18)';
    ctx.fillRect(-7, -8, 14, 5);
    ctx.fillStyle = '#111';
    ctx.fillRect(-20, -12, 8, 24);
    ctx.fillRect(12, -12, 8, 24);
    ctx.restore();
  }

  function drawPickup(p){
    if (!p.alive) return;
    const px = p.x - camX;
    const py = p.y - camY;
    const pulse = 1 + Math.sin(p.pulse) * 0.08;
    ctx.save();
    ctx.translate(px, py);
    ctx.scale(pulse, pulse);
    ctx.beginPath();
    ctx.arc(0, 0, 8, 0, Math.PI * 2);
    ctx.fillStyle = p.type === 'health' ? '#ff7f7f' : '#ffe45a';
    ctx.fill();
    ctx.restore();
  }

  function drawMission(){
    if (!mission || !mission.active) return;
    const x = mission.x - camX;
    const y = mission.y - camY;
    ctx.save();
    ctx.strokeStyle = 'rgba(245,197,66,.95)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(x, y, mission.radius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x, y, 8, 0, Math.PI * 2);
    ctx.fillStyle = '#f5c542';
    ctx.fill();
    ctx.restore();
  }

  function drawMiniMap(){
    const w = 112, h = 112;
    mctx.clearRect(0, 0, w, h);
    mctx.fillStyle = 'rgba(0,0,0,.72)';
    mctx.fillRect(0, 0, w, h);

    // grid
    mctx.fillStyle = 'rgba(255,255,255,.04)';
    for (let i = 0; i <= 4; i++){
      mctx.fillRect(i * (w / 4), 0, 1, h);
      mctx.fillRect(0, i * (h / 4), w, 1);
    }

    // mission
    if (mission && mission.active){
      const mx = mission.x / gameState.w * w;
      const my = mission.y / gameState.h * h;
      mctx.fillStyle = '#f5c542';
      mctx.beginPath();
      mctx.arc(mx, my, 4, 0, Math.PI * 2);
      mctx.fill();
    }

    // cars
    for (const c of cars){
      mctx.fillStyle = c.color;
      mctx.fillRect(c.x / gameState.w * w - 1.5, c.y / gameState.h * h - 1.5, 3, 3);
    }

    // NPCs
    for (const n of npcs){
      mctx.fillStyle = '#dcdcdc';
      mctx.fillRect(n.x / gameState.w * w - 1, n.y / gameState.h * h - 1, 2, 2);
    }

    // cops
    for (const c of cops){
      mctx.fillStyle = '#79b7ff';
      mctx.fillRect(c.x / gameState.w * w - 1, c.y / gameState.h * h - 1, 2, 2);
    }

    // player
    const px = (inCar && currentCar ? currentCar.x : player.x) / gameState.w * w;
    const py = (inCar && currentCar ? currentCar.y : player.y) / gameState.h * h;
    mctx.fillStyle = '#ffcf4d';
    mctx.beginPath();
    mctx.arc(px, py, 4.5, 0, Math.PI * 2);
    mctx.fill();
  }

  function render(){
    const shake = gameState.screenShake > 0 ? gameState.screenShake * 0.5 : 0;
    ctx.save();
    if (shake > 0){
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    drawRoadBase();
    drawBuildings();
    drawMission();

    for (const p of pickups) drawPickup(p);
    for (const n of npcs) drawPerson(n.x, n.y, n.r, '#d9d9d9');
    for (const c of cops) drawPerson(c.x, c.y, c.r, '#79b7ff', 'POL');
    for (const c of cars) drawCar(c);

    if (!inCar) drawPerson(player.x, player.y, player.r, '#ffcf4d', 'YOU');

    // car-following overlay if driving
    if (inCar && currentCar){
      ctx.save();
      ctx.translate(currentCar.x - camX, currentCar.y - camY);
      ctx.rotate(currentCar.angle);
      ctx.strokeStyle = 'rgba(255,255,255,.1)';
      ctx.strokeRect(-22, -13, 44, 26);
      ctx.restore();
    }

    // day/night tint
    const night = (Math.sin(gameState.day) + 1) / 2;
    ctx.fillStyle = `rgba(5,10,20,${0.10 + night * 0.18})`;
    ctx.fillRect(0, 0, viewport.w, viewport.h);

    // wanted glow
    if (wanted > 0){
      const g = ctx.createLinearGradient(0, 0, 0, 90);
      g.addColorStop(0, 'rgba(255,0,0,.09)');
      g.addColorStop(1, 'transparent');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, viewport.w, 90);
    }

    ctx.restore();
    drawMiniMap();
  }

  function loop(now){
    if (!started) return;
    const dt = Math.min(0.033, (now - lastTime) / 1000);
    lastTime = now;
    updateCity(dt);
    render();
    requestAnimationFrame(loop);
  }

  // Intro start image subtle shift
  let startSlideIndex = 0;
  setInterval(() => {
    if (!startScreen.classList.contains('show')) return;
    startSlide.style.opacity = '0';
    setTimeout(() => {
      startSlideIndex = (startSlideIndex + 1) % introSlides.length;
      startSlide.src = introSlides[startSlideIndex];
      startSlide.style.opacity = '1';
    }, 550);
  }, 3600);

  startBtn.addEventListener('click', () => {
    if (started) return;
    started = true;
    beginLoading();
  });

  attackBtn.addEventListener('pointerdown', attack);
  carBtn.addEventListener('pointerdown', enterExitCar);
  missionBtn.addEventListener('pointerdown', missionAction);

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && started && music.paused) {
      music.play().catch(() => {});
    }
  });

  setKnob(0, 0);
  resize();
})();
</script>
</body>
